<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Team Maestro Exam Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .sidebar { min-height: 100vh; background: #1e293b; color: #cbd5e1; width: 240px; position: fixed; top: 0; left: 0; z-index: 100; }
    .sidebar .brand { padding: 1.25rem 1.5rem; font-size: 1.1rem; font-weight: 700; color: #fff; border-bottom: 1px solid #334155; }
    .sidebar .nav-link { color: #94a3b8; padding: .6rem 1.5rem; border-radius: 0; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #334155; color: #fff; }
    .sidebar .nav-link i { margin-right: .5rem; }
    .main-content { margin-left: 240px; padding: 2rem; }
    .stat-card { border-radius: 12px; border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .grade-badge { font-size: .75rem; font-weight: 700; padding: .25em .6em; border-radius: 6px; }
    .grade-A { background: #d1fae5; color: #065f46; }
    .grade-B { background: #dbeafe; color: #1e40af; }
    .grade-C { background: #fef9c3; color: #713f12; }
    .grade-S { background: #fed7aa; color: #9a3412; }
    .grade-F { background: #fee2e2; color: #991b1b; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
