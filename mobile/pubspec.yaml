name: team_maestro_exam_portal
description: Team Maestro Exam Portal — Student & Admin mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & auth
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Charts
  fl_chart: ^0.68.0

  # File picker (admin resource uploads)
  file_picker: ^8.0.7

  # Date/number formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
